  <script>
    // Before first paint: the Christmas palette (same dates as app.js) and the hero photo preload.
    (function () {
      var q = /[?&]christmas=([01])/.exec(location.search);
      var d = new Date(), md = d.getMonth() * 100 + d.getDate();
      var on = q ? q[1] === '1' : (md >= 1006 || md <= 6);
      if (on) document.documentElement.setAttribute('data-season', 'christmas');
      var id = 'photo-1633681926022-84c23e8cb2d6';
      var url = function (w) { return 'https://images.unsplash.com/' + id + '?auto=format&fit=crop&crop=entropy&w=' + w + '&h=' + (w * 1.25) + '&q=62'; };
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.setAttribute('imagesrcset', [320, 640, 960].map(function (w) { return url(w) + ' ' + w + 'w'; }).join(', '));
      link.setAttribute('imagesizes', '(max-width: 700px) 60vw, 420px');
      link.setAttribute('fetchpriority', 'high');
      document.head.appendChild(link);
    })();
  </script>
